<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="iPhone e Apple Watch com cartão Santander no Apple Pay">
  <defs>
    <linearGradient id="phoneFrame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55565a"/><stop offset=".18" stop-color="#111214"/><stop offset=".72" stop-color="#030405"/><stop offset="1" stop-color="#66676a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f1f5"/></linearGradient>
    <linearGradient id="watchFrame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55575a"/><stop offset=".45" stop-color="#17191b"/><stop offset="1" stop-color="#74767a"/></linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343434"/><stop offset=".65" stop-color="#090909"/><stop offset="1" stop-color="#292929"/></linearGradient>
    <linearGradient id="payBands" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1ca66b"/><stop offset=".36" stop-color="#00a3d9"/><stop offset=".7" stop-color="#eac452"/><stop offset="1" stop-color="#e99839"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="170%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#280000" flood-opacity=".28"/></filter>
    <filter id="softShadow" x="-40%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#160000" flood-opacity=".32"/></filter>
  </defs>
